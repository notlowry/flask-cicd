name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Code quality check (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: pytest -v

      - name: Build artifact
        run: |
          mkdir -p dist
          zip -r dist/flask-app.zip app.py requirements.txt Dockerfile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app
          path: dist/flask-app.zip

  deploy-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-app:test .

      - name: Deploy to test environment
        run: docker run -d --name flask-test -p 5000:5000 flask-app:test

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5000/
          curl --fail http://localhost:5000/health

      - name: Container logs
        if: always()
        run: docker logs flask-test
